# .github/workflows/tests.yml
#
# Runs the piec test suite automatically on every pull request and every push
# to the master branch. 

name: Tests

on:
  # Run on every pull request targeting master
  pull_request:
    branches: [master]
  # Also run on direct pushes to master
  push:
    branches: [master]

jobs:
  test:
    # Use the latest Ubuntu runner
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # Minimum supported version and the version validated during standardization.
        python-version: ["3.9", "3.13"]

    steps:
      # 1. Check out the repository code
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Compatibility tests verify immutable baseline commits locally.
          fetch-depth: 0

      # 2. Set up the requested Python version
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # 3. Upgrade pip
      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      # 4. Install the package
      - name: Install piec and test dependencies
        run: |
          pip install pytest
          pip install -e . --no-deps
          pip install pandas numpy matplotlib scipy pyvisa PyVISA-py IPython

      # 5. Run the full test suite
      - name: Run tests
        env:
          MPLBACKEND: Agg
        run: python -c "import piec.measurement.gui_utils; import matplotlib; matplotlib.use('Agg'); import pytest; raise SystemExit(pytest.main(['tests/', '-q', '-p', 'no:cacheprovider', '--tb=short']))"

  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e . -r docs/requirements.txt
      - name: Execute offline measurement notebooks
        run: python scripts/check_measurement_notebooks.py
      - name: Build offline documentation
        env:
          PIEC_DOCS_OFFLINE: "1"
        run: python -m sphinx -W --keep-going -b html docs/source tmp/docs-html
